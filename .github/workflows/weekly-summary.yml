name: Weekly Summary

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure weekly-report label exists
        uses: actions/github-script@v7
        with:
          script: |
            const labelName = 'weekly-report';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: labelName
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: labelName,
                  color: '1d76db',
                  description: '주간 프로젝트 활동 요약 리포트'
                });
              } else {
                throw err;
              }
            }

      - name: Create weekly summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const since = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString();
            const { data: items } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              since: since
            });

            const openIssues = items.filter((item) => !item.pull_request && item.state === 'open').length;
            const closedIssues = items.filter((item) => !item.pull_request && item.state === 'closed').length;
            const prCount = items.filter((item) => Boolean(item.pull_request)).length;
            const today = new Date().toISOString().slice(0, 10);

            const body = [
              '## 📊 주간 프로젝트 활동 요약',
              '',
              `- **열려 있는 이슈:** ${openIssues}건`,
              `- **닫힌 이슈:** ${closedIssues}건`,
              `- **관련 Pull Request 활동:** ${prCount}건`,
              '',
              '> 이 이슈는 GitHub Actions 주간 요약 워크플로우로 자동 생성되었습니다.'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Weekly Summary] 주간 활동 요약 (${today})`,
              body: body,
              labels: ['weekly-report']
            });
