name: Auto Reply to New Issues & PRs

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    steps:
      - name: Comment on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '이슈를 등록해 주셔서 감사합니다! 확인 후 순차적으로 답변드리겠습니다.'
            })
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'PR을 올려주셔서 감사합니다! 변경 사항과 문서 가이드 준수 여부를 확인하겠습니다.'
            })
